name: Add Release to Notion

on:
  release:
    types: [published]

jobs:
  create-notion-row:
    runs-on: ubuntu-latest
    outputs:
      page_id: ${{ steps.notion.outputs.PAGE_ID }}
    steps:
      - name: jq install (if missing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - id: notion
        name: Create or update Notion page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          DATABASE_ID: ${{ secrets.NOTION_DB_TELEOPERATION_ID }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail

          QUERY_PAYLOAD=$(jq -n --arg tag "$TAG_NAME" '{filter:{property:"Version tag (le yaml)", title:{equals:$tag}}}')
          QUERY_RESULT=$(curl -s -X POST "https://api.notion.com/v1/databases/$DATABASE_ID/query" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            --data "$QUERY_PAYLOAD")
          PAGE_ID=$(echo "$QUERY_RESULT" | jq -r '.results[0].id // empty')

          PROPS=$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg url "$RELEASE_URL" \
            --arg date "$PUBLISHED_AT" \
            '{
              "Version Tag": { "title": [ { "text": { "content": $tag } } ] },
              "Release URL": { "url": $url },
              "Release date": { "date": { "start": $date } }
            }')

          make_children() {
            jq -n --arg body "${BODY:-}" '
              def chunks(s; n): [ range(0; (( (s|length) + (n-1) ) / n)) | s[. * n : ((. + 1) * n)] ];
              if ($body|length) == 0 or $body == "null" then [] else
                ([{"object":"block","type":"heading_2","heading_2":{"rich_text":[{"type":"text","text":{"content":"Changelog"}}]}}]
                + (chunks($body; 1800) | map({"object":"block","type":"paragraph","paragraph":{"rich_text":[{"type":"text","text":{"content":.}}]}})))
              end
            '
          }
          CHILDREN=$(make_children)

          if [ -n "$PAGE_ID" ]; then
            echo "Existing page found for $TAG_NAME, update properties."
            UPDATE_PAYLOAD=$(jq -n --argjson props "$PROPS" '{properties:$props}')
            curl -s -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Notion-Version: 2022-06-28" \
              --data "$UPDATE_PAYLOAD" >/dev/null
          else
            echo "No page found for $TAG_NAME, create one."
            CREATE_PAYLOAD=$(jq -n \
              --arg db "$DATABASE_ID" \
              --argjson props "$PROPS" \
              --argjson children "$CHILDREN" \
              '{
                parent:{database_id:$db},
                properties:$props,
                children:$children,
                icon:{ "type":"emoji", "emoji":"✅" }
              }')
            CREATE_RESULT=$(curl -s -X POST "https://api.notion.com/v1/pages" \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Notion-Version: 2022-06-28" \
              --data "$CREATE_PAYLOAD")
            PAGE_ID=$(echo "$CREATE_RESULT" | jq -r '.id')
          fi

          echo "PAGE_ID=$PAGE_ID" >> "$GITHUB_OUTPUT"
          echo "Sync Release to Notion OK."
  
  set-sdk-api-version:
    name: Set reachy2-sdk-api select from submodule
    runs-on: ubuntu-latest
    needs: create-notion-row
    env:
      PAGE_ID: ${{ needs.create-notion-row.outputs.page_id }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TAG_NAME: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout at release tag (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
          submodules: recursive

      - name: Locate submodule under Assets/Scripts pointing to reachy2-sdk-api
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          SUB_PATH="Assets/Scripts/reachy2-sdk-api"

          git config -f .gitmodules "submodule.${SUB_PATH}.path" >/dev/null || {
            echo "::error::Le submodule ${SUB_PATH} n'est pas déclaré dans .gitmodules"; exit 1;
          }

          git submodule update --init --recursive -- "$SUB_PATH"

          [ -d "$SUB_PATH" ] || { echo "::error::Dossier introuvable: $SUB_PATH"; exit 1; }

          echo "SUB_PATH=$SUB_PATH" >> "$GITHUB_OUTPUT"

      - name: Read __version__ from submodule __init__.py
        id: readver
        shell: bash
        run: |
          set -euo pipefail
          SUB_PATH="${{ steps.locate.outputs.SUB_PATH }}"
          INIT_FILE="$SUB_PATH/python/reachy2_sdk_api/__init__.py"
          [ -f "$INIT_FILE" ] || { echo "::error::Introuvable: $INIT_FILE"; exit 1; }

          SDK_API_VERSION="$(sed -nE 's/^[[:space:]]*__version__[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' "$INIT_FILE" | head -n1)"

          echo "Parsed version: $SDK_API_VERSION"
          [ -n "$SDK_API_VERSION" ] || { echo "::error::__version__ non trouvé dans $INIT_FILE"; exit 1; }
          echo "SDK_API_VERSION=$SDK_API_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Notion select property "reachy2-sdk-api"
        if: ${{ env.PAGE_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_API_VERSION='${{ steps.readver.outputs.SDK_API_VERSION }}'

          PROPS=$(jq -n --arg v "$SDK_API_VERSION" '{
            "reachy2-sdk-api": { "select": { "name": $v } }
          }')
          PAYLOAD=$(jq -n --argjson props "$PROPS" '{properties: $props}')

          curl -s -X PATCH "https://api.notion.com/v1/pages/${PAGE_ID}" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            --data "$PAYLOAD" >/dev/null

          echo "Updated Notion property reachy2-sdk-api = ${SDK_API_VERSION}"