name: Release to Notion

on:
  release:
    types: [published]

jobs:
  create-notion-row:
    runs-on: ubuntu-latest
    steps:
      - name: jq install (if missing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      - name: Create or update Notion page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail

          # Check if this tag exists as a page in the Notion database
          QUERY_PAYLOAD=$(jq -n \
            --arg tag "$TAG_NAME" \
            '{filter:{property:"Version tag (le yaml)", title:{equals:$tag}}}')

          QUERY_RESULT=$(curl -s -X POST "https://api.notion.com/v1/databases/$DATABASE_ID/query" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            --data "$QUERY_PAYLOAD")

          PAGE_ID=$(echo "$QUERY_RESULT" | jq -r '.results[0].id // empty')

          # Notion page properties
          PROPS=$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg url "$RELEASE_URL" \
            --arg date "$PUBLISHED_AT" \
            '{
              "Version tag": { "title": [ { "text": { "content": $tag } } ] },
              "Release URL": { "url": $url },
              "Date": { "date": { "start": $date } }
            }')

          # Children blocks for the Notion page
          # - Add a "Changelog" heading
          # - Split the BODY into chunks of max 1800 characters to avoid Notion limits
          make_children() {
            jq -n --arg body "${BODY:-}" '
              def chunks(s; n):
                [ range(0; (( (s|length) + (n-1) ) / n)) | s[. * n : ((. + 1) * n)] ];
              if ($body|length) == 0 or $body == "null" then
                []
              else
                ([{
                  "object":"block",
                  "type":"heading_2",
                  "heading_2":{"rich_text":[{"type":"text","text":{"content":"Changelog"}}]}
                }]
                +
                (chunks($body; 1800) | map({
                  "object":"block",
                  "type":"paragraph",
                  "paragraph":{"rich_text":[{"type":"text","text":{"content":.}}]}
                })))
              end
            '
          }
          CHILDREN=$(make_children)

          if [ -n "$PAGE_ID" ]; then
            echo "Existing page found for $TAG_NAME → update properties."
            UPDATE_PAYLOAD=$(jq -n --argjson props "$PROPS" '{properties:$props}')
            curl -s -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Notion-Version: 2022-06-28" \
              --data "$UPDATE_PAYLOAD" >/dev/null

          else
            echo "No page found $TAG_NAME → create one."
            CREATE_PAYLOAD=$(jq -n \
              --arg db "$DATABASE_ID" \
              --argjson props "$PROPS" \
              --argjson children "$CHILDREN" \
              '{parent:{database_id:$db}, properties:$props, children:$children}')
            curl -s -X POST "https://api.notion.com/v1/pages" \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Notion-Version: 2022-06-28" \
              --data "$CREATE_PAYLOAD" >/dev/null
          fi

          echo "Sync Release to Notion OK."